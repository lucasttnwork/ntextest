<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NTEX - Agentes IA</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #343541;
            color: #ececf1;
            height: 100vh;
            overflow: hidden;
        }
        
        .app-container {
            display: flex;
            height: 100vh;
        }
        
        /* Sidebar */
        .sidebar {
            width: 260px;
            background: #202123;
            border-right: 1px solid #4a4b53;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid #4a4b53;
        }
        
        .sidebar-header h1 {
            font-size: 18px;
            font-weight: 600;
            color: #ececf1;
            margin-bottom: 5px;
        }
        
        .sidebar-header p {
            font-size: 12px;
            color: #8e8ea0;
        }
        
        .new-chat-btn {
            width: 100%;
            padding: 12px 16px;
            background: #343541;
            border: 1px solid #565869;
            border-radius: 6px;
            color: #ececf1;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            margin: 0 20px 20px;
        }
        
        .new-chat-btn:hover {
            background: #40414f;
        }
        
        .sidebar-actions {
            padding: 0 20px 20px;
        }
        
        .action-btn {
            width: 100%;
            padding: 10px 12px;
            background: transparent;
            border: 1px solid #565869;
            border-radius: 6px;
            color: #ececf1;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 8px;
            text-align: left;
        }
        
        .action-btn:hover {
            background: #40414f;
        }
        
        /* Main Chat Area */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #343541;
        }
        
        .chat-header {
            padding: 20px;
            border-bottom: 1px solid #4a4b53;
            text-align: center;
        }
        
        .chat-header h2 {
            font-size: 20px;
            font-weight: 600;
            color: #ececf1;
        }
        
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }
        
        .message {
            display: flex;
            margin-bottom: 20px;
            animation: fadeIn 0.3s ease-in;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .message-avatar {
            width: 30px;
            height: 30px;
            border-radius: 4px;
            margin-right: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 14px;
        }
        
        .user-avatar {
            background: #10a37f;
            color: white;
        }
        
        .assistant-avatar {
            background: #19c37d;
            color: white;
        }
        
        .message-content {
            flex: 1;
            line-height: 1.6;
        }
        
        .message-text {
            margin-bottom: 10px;
        }
        
        /* Agent Process Blocks */
        .agent-process {
            background: #444654;
            border-radius: 8px;
            padding: 20px;
            margin: 15px 0;
            border-left: 4px solid #19c37d;
        }
        
        .agent-process-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 15px;
        }
        
        .agent-process-title {
            font-size: 16px;
            font-weight: 600;
            color: #ececf1;
            display: flex;
            align-items: center;
        }
        
        .agent-process-icon {
            width: 24px;
            height: 24px;
            background: #19c37d;
            border-radius: 50%;
            margin-right: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 12px;
            font-weight: bold;
        }
        
        .agent-process-status {
            font-size: 12px;
            color: #8e8ea0;
            display: flex;
            align-items: center;
        }
        
        .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid #19c37d;
            border-top: 2px solid transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 8px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .agent-steps {
            margin-bottom: 15px;
        }
        
        .agent-step {
            display: flex;
            align-items: center;
            background: #3e3f4b;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 8px;
        }
        
        .step-number {
            width: 24px;
            height: 24px;
            background: #19c37d;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 12px;
            font-weight: bold;
            margin-right: 12px;
        }
        
        .step-text {
            flex: 1;
            font-size: 14px;
        }
        
        .agent-log {
            background: #2d2d30;
            border-radius: 6px;
            padding: 12px;
            margin-top: 10px;
            border-left: 3px solid #19c37d;
            font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
            font-size: 12px;
            color: #d1d5db;
        }
        
        .log-icon {
            color: #19c37d;
            margin-right: 8px;
        }
        
        /* Toggle de Pensamentos */
        .thoughts-toggle {
            background: #444654;
            border-radius: 6px;
            padding: 12px;
            margin: 10px 0;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid #565869;
        }
        
        .thoughts-toggle:hover {
            background: #4a4b53;
        }
        
        .thoughts-toggle-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .thoughts-toggle-title {
            font-size: 14px;
            color: #8e8ea0;
            display: flex;
            align-items: center;
        }
        
        .thoughts-toggle-icon {
            width: 16px;
            height: 16px;
            background: #19c37d;
            border-radius: 50%;
            margin-right: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 10px;
            font-weight: bold;
        }
        
        .thoughts-toggle-arrow {
            color: #8e8ea0;
            transition: transform 0.2s;
        }
        
        .thoughts-toggle.expanded .thoughts-toggle-arrow {
            transform: rotate(180deg);
        }
        
        .thoughts-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease-out;
        }
        
        .thoughts-toggle.expanded .thoughts-content {
            max-height: 500px;
            margin-top: 15px;
        }
        
        .thought-item {
            background: #3e3f4b;
            border-radius: 4px;
            padding: 10px;
            margin-bottom: 8px;
            font-size: 12px;
            color: #d1d5db;
            border-left: 2px solid #19c37d;
        }
        
        .thought-timestamp {
            color: #8e8ea0;
            font-size: 10px;
            margin-bottom: 5px;
        }
        
        /* Imagens e Arquivos */
        .message-files {
            margin-top: 15px;
        }
        
        .file-item {
            background: #444654;
            border-radius: 6px;
            padding: 15px;
            margin-bottom: 10px;
            border: 1px solid #565869;
        }
        
        .file-header {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
        }
        
        .file-icon {
            width: 20px;
            height: 20px;
            background: #19c37d;
            border-radius: 4px;
            margin-right: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 10px;
        }
        
        .file-name {
            font-size: 14px;
            font-weight: 500;
            color: #ececf1;
        }
        
        .file-preview {
            max-width: 100%;
            border-radius: 4px;
            margin-top: 10px;
        }
        
        .file-preview img {
            max-width: 100%;
            height: auto;
            border-radius: 4px;
        }
        
        /* Input Area */
        .chat-input-area {
            padding: 20px;
            border-top: 1px solid #4a4b53;
            background: #343541;
        }
        
        .input-container {
            display: flex;
            align-items: flex-end;
            background: #40414f;
            border: 1px solid #565869;
            border-radius: 8px;
            padding: 12px;
            max-height: 200px;
        }
        
        .chat-input {
            flex: 1;
            background: transparent;
            border: none;
            color: #ececf1;
            font-size: 14px;
            line-height: 1.5;
            resize: none;
            outline: none;
            font-family: inherit;
            min-height: 20px;
            max-height: 150px;
        }
        
        .chat-input::placeholder {
            color: #8e8ea0;
        }
        
        .send-button {
            width: 32px;
            height: 32px;
            background: #19c37d;
            border: none;
            border-radius: 6px;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-left: 12px;
            transition: background 0.2s;
        }
        
        .send-button:hover {
            background: #15a367;
        }
        
        .send-button:disabled {
            background: #565869;
            cursor: not-allowed;
        }
        
        /* Responsividade */
        @media (max-width: 768px) {
            .sidebar {
                width: 200px;
            }
            
            .agent-process {
                padding: 15px;
            }
            
            .agent-step {
                padding: 10px;
            }
        }
        
        /* Scrollbar personalizada */
        .chat-messages::-webkit-scrollbar {
            width: 8px;
        }
        
        .chat-messages::-webkit-scrollbar-track {
            background: #2d2d30;
        }
        
        .chat-messages::-webkit-scrollbar-thumb {
            background: #565869;
            border-radius: 4px;
        }
        
        .chat-messages::-webkit-scrollbar-thumb:hover {
            background: #6b6c7b;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="sidebar-header">
                <h1>NTEX</h1>
                <p>Agentes IA</p>
            </div>
            
            <button class="new-chat-btn" onclick="newChat()">
                + Nova conversa
            </button>
            
            <div class="sidebar-actions">
                <button class="action-btn" onclick="createInstagramPost()">
                    📝 Criar post Instagram
                </button>
                <button class="action-btn" onclick="createAd()">
                    📢 Criar anúncio
                </button>
                <button class="action-btn" onclick="createDesign()">
                    🎨 Criar design
                </button>
                <button class="action-btn" onclick="createCampaign()">
                    🚀 Criar campanha
                </button>
                <button class="action-btn" onclick="showSystemStatus()">
                    📊 Status sistema
                </button>
                <button class="action-btn" onclick="showHelp()">
                    ❓ Ajuda
                </button>
            </div>
        </div>
        
        <!-- Main Chat Area -->
        <div class="chat-area">
            <div class="chat-header">
                <h2 id="chat-title">Nova conversa</h2>
            </div>
            
            <div class="chat-messages" id="chat-messages">
                <!-- Mensagens serão inseridas aqui -->
            </div>
            
            <div class="chat-input-area">
                <div class="input-container">
                    <textarea 
                        class="chat-input" 
                        id="chat-input" 
                        placeholder="Digite sua mensagem..."
                        rows="1"
                        onkeydown="handleKeyDown(event)"
                    ></textarea>
                    <button class="send-button" id="send-button" onclick="sendMessage()">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Estado da aplicação
        let currentSessionId = null;
        let isProcessing = false;
        let messageCounter = 0;
        
        // Inicialização
        document.addEventListener('DOMContentLoaded', function() {
            // Auto-resize do input
            const textarea = document.getElementById('chat-input');
            textarea.addEventListener('input', function() {
                this.style.height = 'auto';
                this.style.height = Math.min(this.scrollHeight, 150) + 'px';
            });
            
            // Focar no input
            textarea.focus();
        });
        
        // Funções de navegação
        function newChat() {
            currentSessionId = null;
            document.getElementById('chat-title').textContent = 'Nova conversa';
            document.getElementById('chat-messages').innerHTML = '';
            messageCounter = 0;
        }
        
        function createInstagramPost() {
            sendMessage('Criar post para Instagram sobre automação de marketing');
        }
        
        function createAd() {
            sendMessage('Criar anúncio para campanha de marketing digital');
        }
        
        function createDesign() {
            sendMessage('Criar design visual para campanha de marketing');
        }
        
        function createCampaign() {
            sendMessage('Criar campanha completa de marketing digital');
        }
        
        function showSystemStatus() {
            sendMessage('Mostrar status do sistema e agentes');
        }
        
        function showHelp() {
            sendMessage('Como usar os agentes NTEX?');
        }
        
        // Funções de chat
        function handleKeyDown(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        }
        
        function sendMessage(customMessage = null) {
            const input = document.getElementById('chat-input');
            const message = customMessage || input.value.trim();
            
            if (!message || isProcessing) return;
            
            // Adicionar mensagem do usuário
            addMessage('user', message);
            input.value = '';
            input.style.height = 'auto';
            
            // Processar com agente
            processWithAgent(message);
        }
        
        function addMessage(role, content, agentName = null, metadata = {}) {
            const messagesContainer = document.getElementById('chat-messages');
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message';
            
            const avatar = document.createElement('div');
            avatar.className = `message-avatar ${role === 'user' ? 'user-avatar' : 'assistant-avatar'}`;
            avatar.textContent = role === 'user' ? 'U' : 'NT';
            
            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';
            
            if (role === 'assistant' && metadata.agentProcess) {
                // Renderizar processo do agente
                contentDiv.innerHTML = renderAgentProcess(metadata.agentProcess);
            } else {
                // Mensagem normal
                const textDiv = document.createElement('div');
                textDiv.className = 'message-text';
                textDiv.textContent = content;
                contentDiv.appendChild(textDiv);
                
                // Adicionar arquivos se houver
                if (metadata.files && metadata.files.length > 0) {
                    const filesDiv = document.createElement('div');
                    filesDiv.className = 'message-files';
                    metadata.files.forEach(file => {
                        filesDiv.appendChild(renderFileItem(file));
                    });
                    contentDiv.appendChild(filesDiv);
                }
            }
            
            messageDiv.appendChild(avatar);
            messageDiv.appendChild(contentDiv);
            messagesContainer.appendChild(messageDiv);
            
            // Scroll para baixo
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
            
            messageCounter++;
        }
        
        function renderAgentProcess(process) {
            return `
                <div class="agent-process">
                    <div class="agent-process-header">
                        <div class="agent-process-title">
                            <div class="agent-process-icon">${process.agentIcon || 'NT'}</div>
                            ${process.agentName} - ${process.processName}
                        </div>
                        <div class="agent-process-status">
                            <div class="spinner"></div>
                            Processando...
                        </div>
                    </div>
                    
                    <div class="agent-steps">
                        ${process.steps.map((step, index) => `
                            <div class="agent-step">
                                <div class="step-number">${index + 1}</div>
                                <div class="step-text">${step}</div>
                            </div>
                        `).join('')}
                    </div>
                    
                    ${process.logs ? `
                        <div class="agent-log">
                            <span class="log-icon">📋</span>
                            Log: ${process.logs}
                        </div>
                    ` : ''}
                    
                    ${process.thoughts && process.thoughts.length > 0 ? `
                        <div class="thoughts-toggle" onclick="toggleThoughts(this)">
                            <div class="thoughts-toggle-header">
                                <div class="thoughts-toggle-title">
                                    <div class="thoughts-toggle-icon">🧠</div>
                                    Pensamentos do Agente (${process.thoughts.length})
                                </div>
                                <div class="thoughts-toggle-arrow">▼</div>
                            </div>
                            <div class="thoughts-content">
                                ${process.thoughts.map(thought => `
                                    <div class="thought-item">
                                        <div class="thought-timestamp">${thought.timestamp}</div>
                                        ${thought.content}
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    ` : ''}
                </div>
            `;
        }
        
        function renderFileItem(file) {
            const fileDiv = document.createElement('div');
            fileDiv.className = 'file-item';
            
            let fileIcon = '📄';
            if (file.type === 'image') fileIcon = '🖼️';
            else if (file.type === 'video') fileIcon = '🎥';
            
            let preview = '';
            if (file.type === 'image' && file.url) {
                preview = `<div class="file-preview"><img src="${file.url}" alt="${file.name}" /></div>`;
            }
            
            fileDiv.innerHTML = `
                <div class="file-header">
                    <div class="file-icon">${fileIcon}</div>
                    <div class="file-name">${file.name}</div>
                </div>
                ${preview}
            `;
            
            return fileDiv;
        }
        
        function toggleThoughts(toggleElement) {
            toggleElement.classList.toggle('expanded');
        }
        
        // Processamento real com agente via API
        async function processWithAgent(userMessage) {
            isProcessing = true;
            const sendButton = document.getElementById('send-button');
            sendButton.disabled = true;
            
            try {
                // Mostrar indicador de processamento
                addMessage('assistant', '🤖 Processando sua mensagem...', 'NTEX_System', {});
                
                // Enviar para o backend
                const response = await sendMessageToBackend(userMessage);
                
                if (response.success) {
                    // Remover mensagem de processamento
                    const messagesContainer = document.getElementById('chat-messages');
                    messagesContainer.removeChild(messagesContainer.lastChild);
                    
                    // Adicionar resposta real do agente
                    addMessage('assistant', response.response, response.agent, {
                        agent: response.agent,
                        capabilities: response.capabilities
                    });
                } else {
                    // Remover mensagem de processamento
                    const messagesContainer = document.getElementById('chat-messages');
                    messagesContainer.removeChild(messagesContainer.lastChild);
                    
                    // Mostrar erro
                    addMessage('assistant', `❌ Erro: ${response.error || 'Falha na comunicação com o agente'}`, 'NTEX_System', {});
                }
                
            } catch (error) {
                console.error('Erro no processamento:', error);
                
                // Remover mensagem de processamento
                const messagesContainer = document.getElementById('chat-messages');
                if (messagesContainer.lastChild) {
                    messagesContainer.removeChild(messagesContainer.lastChild);
                }
                
                // Mostrar erro
                addMessage('assistant', '❌ Erro de conexão com o servidor', 'NTEX_System', {});
            } finally {
                isProcessing = false;
                sendButton.disabled = false;
            }
        }
        
        // Funções para integração com backend real
        async function sendMessageToBackend(message) {
            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        message: message,
                        session_id: currentSessionId
                    })
                });
                
                const data = await response.json();
                return data;
                
            } catch (error) {
                console.error('Erro ao enviar mensagem:', error);
                return { error: 'Erro de conexão' };
            }
        }
    </script>
</body>
</html>
