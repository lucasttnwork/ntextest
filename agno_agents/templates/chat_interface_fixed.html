<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NTEX - Agentes IA</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #343541;
            color: #ececf1;
            height: 100vh;
            overflow: hidden;
        }
        
        .app-container {
            display: flex;
            height: 100vh;
        }
        
        /* Sidebar */
        .sidebar {
            width: 260px;
            background: #202123;
            border-right: 1px solid #4a4b53;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid #4a4b53;
        }
        
        .sidebar-header h1 {
            font-size: 18px;
            font-weight: 600;
            color: #ececf1;
            margin-bottom: 5px;
        }
        
        .sidebar-header p {
            font-size: 12px;
            color: #8e8ea0;
        }
        
        .new-chat-btn {
            width: 100%;
            padding: 12px 16px;
            background: #343541;
            border: 1px solid #565869;
            border-radius: 6px;
            color: #ececf1;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            margin: 0 20px 20px;
        }
        
        .new-chat-btn:hover {
            background: #40414f;
        }
        
        .sidebar-actions {
            padding: 0 20px 20px;
        }
        
        .action-btn {
            width: 100%;
            padding: 10px 12px;
            background: transparent;
            border: 1px solid #565869;
            border-radius: 6px;
            color: #ececf1;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 8px;
            text-align: left;
        }
        
        .action-btn:hover {
            background: #40414f;
        }
        
        /* Main Chat Area */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #343541;
        }
        
        .chat-header {
            padding: 20px;
            border-bottom: 1px solid #4a4b53;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .chat-title {
            font-size: 20px;
            font-weight: 600;
            color: #ececf1;
        }
        
        .chat-actions {
            display: flex;
            gap: 10px;
        }
        
        .chat-action-btn {
            padding: 8px 12px;
            background: transparent;
            border: 1px solid #565869;
            border-radius: 4px;
            color: #ececf1;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .chat-action-btn:hover {
            background: #40414f;
        }
        
        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        
        .message {
            display: flex;
            gap: 15px;
            animation: fadeIn 0.3s ease-in;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .message-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 600;
            flex-shrink: 0;
        }
        
        .user-avatar {
            background: #10a37f;
            color: white;
        }
        
        .assistant-avatar {
            background: #1a7f64;
            color: white;
        }
        
        .message-content {
            flex: 1;
            line-height: 1.6;
        }
        
        .message-text {
            font-size: 14px;
            color: #ececf1;
            white-space: pre-wrap;
        }
        
        .message-files {
            margin-top: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        .file-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px;
            background: #40414f;
            border-radius: 6px;
            border: 1px solid #565869;
        }
        
        .file-icon {
            font-size: 20px;
        }
        
        .file-info {
            flex: 1;
        }
        
        .file-name {
            font-size: 13px;
            font-weight: 500;
            color: #ececf1;
        }
        
        .file-type {
            font-size: 11px;
            color: #8e8ea0;
        }
        
        .file-download {
            padding: 6px 12px;
            background: #10a37f;
            border: none;
            border-radius: 4px;
            color: white;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .file-download:hover {
            background: #0d8a6f;
        }
        
        /* Input Area */
        .input-area {
            padding: 20px;
            border-top: 1px solid #4a4b53;
            background: #343541;
        }
        
        .input-container {
            display: flex;
            gap: 10px;
            align-items: flex-end;
            background: #40414f;
            border: 1px solid #565869;
            border-radius: 8px;
            padding: 12px;
        }
        
        .chat-input {
            flex: 1;
            background: transparent;
            border: none;
            color: #ececf1;
            font-size: 14px;
            line-height: 1.5;
            resize: none;
            outline: none;
            font-family: inherit;
            min-height: 24px;
            max-height: 120px;
        }
        
        .chat-input::placeholder {
            color: #8e8ea0;
        }
        
        .send-button {
            padding: 8px 16px;
            background: #10a37f;
            border: none;
            border-radius: 6px;
            color: white;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .send-button:hover:not(:disabled) {
            background: #0d8a6f;
        }
        
        .send-button:disabled {
            background: #565869;
            cursor: not-allowed;
        }
        
        .send-icon {
            font-size: 16px;
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            .sidebar {
                display: none;
            }
            
            .chat-header {
                padding: 15px;
            }
            
            .messages-container {
                padding: 15px;
            }
            
            .input-area {
                padding: 15px;
            }
        }
        
        /* Loading States */
        .loading {
            opacity: 0.6;
            pointer-events: none;
        }
        
        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #565869;
            border-radius: 50%;
            border-top-color: #10a37f;
            animation: spin 1s ease-in-out infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        /* Error States */
        .error-message {
            color: #ff6b6b;
            background: rgba(255, 107, 107, 0.1);
            border: 1px solid rgba(255, 107, 107, 0.3);
            border-radius: 6px;
            padding: 10px;
            margin-top: 10px;
        }
        
        /* Success States */
        .success-message {
            color: #51cf66;
            background: rgba(81, 207, 102, 0.1);
            border: 1px solid rgba(81, 207, 102, 0.3);
            border-radius: 6px;
            padding: 10px;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="sidebar-header">
                <h1>🤖 NTEX IA</h1>
                <p>Sistema de Agentes Inteligentes</p>
            </div>
            
            <button class="new-chat-btn" onclick="newChat()">
                ✨ Nova Conversa
            </button>
            
            <div class="sidebar-actions">
                <button class="action-btn" onclick="showSystemStatus()">
                    📊 Status do Sistema
                </button>
                <button class="action-btn" onclick="showHelp()">
                    ❓ Como Usar
                </button>
                <button class="action-btn" onclick="showAgents()">
                    🤖 Agentes Disponíveis
                </button>
            </div>
        </div>
        
        <!-- Main Chat Area -->
        <div class="chat-area">
            <div class="chat-header">
                <div class="chat-title">Chat com Agentes NTEX</div>
                <div class="chat-actions">
                    <button class="chat-action-btn" onclick="clearChat()">
                        🗑️ Limpar
                    </button>
                    <button class="chat-action-btn" onclick="exportChat()">
                        📥 Exportar
                    </button>
                </div>
            </div>
            
            <div class="messages-container" id="chat-messages">
                <!-- Mensagens aparecerão aqui -->
            </div>
            
            <div class="input-area">
                <div class="input-container">
                    <textarea 
                        class="chat-input" 
                        id="chat-input"
                        placeholder="Digite sua mensagem aqui... (Enter para enviar, Shift+Enter para nova linha)"
                        rows="1"
                    ></textarea>
                    <button class="send-button" id="send-button" onclick="sendMessage()">
                        <span class="send-icon">📤</span>
                        Enviar
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let isProcessing = false;
        let messageCounter = 0;
        let currentSessionId = null;
        
        // Inicializar quando a página carregar
        document.addEventListener('DOMContentLoaded', function() {
            const textarea = document.getElementById('chat-input');
            
            // Auto-resize do textarea
            textarea.addEventListener('input', function() {
                this.style.height = 'auto';
                this.style.height = Math.min(this.scrollHeight, 120) + 'px';
            });
            
            // Enviar com Enter
            textarea.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
            });
            
            // Gerar nova sessão
            currentSessionId = generateSessionId();
            
            // Mensagem de boas-vindas
            addMessage('assistant', `🤖 Olá! Sou o sistema de agentes IA da NTEX.

Posso ajudar você com:
• 📝 Criação de copy para redes sociais
• 🎨 Design visual e templates
• 🚀 Estratégias de marketing digital
• 📊 Análise de campanhas

Como posso ajudar hoje?`, 'NTEX_System', {});
        });
        
        function newChat() {
            // Limpar mensagens
            document.getElementById('chat-messages').innerHTML = '';
            messageCounter = 0;
            
            // Nova sessão
            currentSessionId = generateSessionId();
            
            // Mensagem de boas-vindas
            addMessage('assistant', `🤖 Nova conversa iniciada!

Como posso ajudar você hoje?`, 'NTEX_System', {});
        }
        
        function sendMessage(customMessage = null) {
            const input = document.getElementById('chat-input');
            const message = customMessage || input.value.trim();
            
            if (!message || isProcessing) return;
            
            // Adicionar mensagem do usuário
            addMessage('user', message);
            input.value = '';
            input.style.height = 'auto';
            
            // Processar com agente
            processWithAgent(message);
        }
        
        function addMessage(role, content, agentName = null, metadata = {}) {
            const messagesContainer = document.getElementById('chat-messages');
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message';
            
            const avatar = document.createElement('div');
            avatar.className = `message-avatar ${role === 'user' ? 'user-avatar' : 'assistant-avatar'}`;
            avatar.textContent = role === 'user' ? 'U' : 'NT';
            
            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';
            
            const textDiv = document.createElement('div');
            textDiv.className = 'message-text';
            textDiv.textContent = content;
            contentDiv.appendChild(textDiv);
            
            // Adicionar informações do agente se disponível
            if (role === 'assistant' && metadata.agent) {
                const agentInfo = document.createElement('div');
                agentInfo.style.fontSize = '12px';
                agentInfo.style.color = '#8e8ea0';
                agentInfo.style.marginTop = '5px';
                agentInfo.textContent = `🤖 ${metadata.agent}`;
                contentDiv.appendChild(agentInfo);
            }
            
            messageDiv.appendChild(avatar);
            messageDiv.appendChild(contentDiv);
            messagesContainer.appendChild(messageDiv);
            
            // Scroll para baixo
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
            
            messageCounter++;
        }
        
        // Processamento real com agente via API
        async function processWithAgent(userMessage) {
            isProcessing = true;
            const sendButton = document.getElementById('send-button');
            sendButton.disabled = true;
            
            try {
                // Mostrar indicador de processamento
                addMessage('assistant', '🤖 Processando sua mensagem...', 'NTEX_System', {});
                
                // Enviar para o backend
                const response = await sendMessageToBackend(userMessage);
                
                if (response.success) {
                    // Remover mensagem de processamento
                    const messagesContainer = document.getElementById('chat-messages');
                    messagesContainer.removeChild(messagesContainer.lastChild);
                    
                    // Adicionar resposta real do agente
                    addMessage('assistant', response.response, response.agent, {
                        agent: response.agent,
                        capabilities: response.capabilities
                    });
                } else {
                    // Remover mensagem de processamento
                    const messagesContainer = document.getElementById('chat-messages');
                    messagesContainer.removeChild(messagesContainer.lastChild);
                    
                    // Mostrar erro
                    addMessage('assistant', `❌ Erro: ${response.error || 'Falha na comunicação com o agente'}`, 'NTEX_System', {});
                }
                
            } catch (error) {
                console.error('Erro no processamento:', error);
                
                // Remover mensagem de processamento
                const messagesContainer = document.getElementById('chat-messages');
                if (messagesContainer.lastChild) {
                    messagesContainer.removeChild(messagesContainer.lastChild);
                }
                
                // Mostrar erro
                addMessage('assistant', '❌ Erro de conexão com o servidor', 'NTEX_System', {});
            } finally {
                isProcessing = false;
                sendButton.disabled = false;
            }
        }
        
        // Funções para integração com backend real
        async function sendMessageToBackend(message) {
            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        message: message,
                        session_id: currentSessionId
                    })
                });
                
                const data = await response.json();
                return data;
                
            } catch (error) {
                console.error('Erro ao enviar mensagem:', error);
                return { error: 'Erro de conexão' };
            }
        }
        
        function generateSessionId() {
            return 'session_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
        }
        
        function clearChat() {
            if (confirm('Tem certeza que deseja limpar o chat?')) {
                newChat();
            }
        }
        
        function exportChat() {
            const messages = document.querySelectorAll('.message');
            let exportText = 'Chat NTEX - ' + new Date().toLocaleString() + '\n\n';
            
            messages.forEach(message => {
                const role = message.querySelector('.user-avatar') ? 'Usuário' : 'NTEX';
                const content = message.querySelector('.message-text').textContent;
                exportText += `[${role}]: ${content}\n\n`;
            });
            
            const blob = new Blob([exportText], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'chat_ntex.txt';
            a.click();
            URL.revokeObjectURL(url);
        }
        
        function showSystemStatus() {
            fetch('/api/agents/status')
                .then(response => response.json())
                .then(data => {
                    let statusText = '📊 **Status do Sistema NTEX**\n\n';
                    
                    if (data.master_agent) {
                        statusText += `🤖 **Master Agent**: ${data.master_agent.status}\n`;
                        statusText += `   Capacidades: ${data.master_agent.capabilities.join(', ')}\n\n`;
                    }
                    
                    if (data.copy_agent) {
                        statusText += `📝 **Copy Agent**: ${data.copy_agent.status}\n`;
                        statusText += `   Capacidades: ${data.copy_agent.capabilities.join(', ')}\n\n`;
                    }
                    
                    if (data.design_agent) {
                        statusText += `🎨 **Design Agent**: ${data.design_agent.status}\n`;
                        statusText += `   Capacidades: ${data.design_agent.capabilities.join(', ')}\n\n`;
                    }
                    
                    if (data.supabase) {
                        statusText += `💾 **Banco de Dados**: ${data.supabase.status}\n`;
                        statusText += `   Capacidades: ${data.supabase.capabilities.join(', ')}\n`;
                    }
                    
                    addMessage('assistant', statusText, 'NTEX_System', {});
                })
                .catch(error => {
                    addMessage('assistant', '❌ Erro ao obter status do sistema', 'NTEX_System', {});
                });
        }
        
        function showHelp() {
            const helpText = `❓ **Como usar os Agentes NTEX:**

1. **📝 Copy Agent**: Para criar textos, posts, anúncios
   - Exemplo: "Criar post para Instagram sobre automação"

2. **🎨 Design Agent**: Para design visual e templates
   - Exemplo: "Criar visual para campanha de marketing"

3. **🤖 Master Agent**: Para coordenação e estratégia
   - Exemplo: "Criar campanha completa de marketing"

**💡 Dicas:**
• Seja específico no seu pedido
• Mencione o objetivo da campanha
• Especifique o público-alvo
• Indique o formato desejado

**🚀 Comandos rápidos:**
• Digite "ajuda" para ver esta mensagem
• Digite "status" para ver o sistema
• Digite "agentes" para ver capacidades`;
            
            addMessage('assistant', helpText, 'NTEX_System', {});
        }
        
        function showAgents() {
            const agentsText = `🤖 **Agentes Disponíveis no Sistema NTEX:**

**📝 Copy Agent**
• Criação de copy para redes sociais
• Redação de anúncios publicitários
• Desenvolvimento de conteúdo persuasivo
• Otimização de textos para conversão

**🎨 Design Agent**
• Criação de templates visuais
• Design de campanhas publicitárias
• Desenvolvimento de identidade visual
• Criação de materiais para redes sociais

**🤖 Master Agent**
• Coordenação entre agentes
• Estratégia de campanhas
• Análise de resultados
• Otimização de processos

**💾 Sistema de Memória**
• Histórico de conversas
• Contexto persistente
• Logs de execução
• Aprendizado contínuo`;
            
            addMessage('assistant', agentsText, 'NTEX_System', {});
        }
    </script>
</body>
</html>
